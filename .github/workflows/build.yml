name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live (pdflatex — matches IEEE submission pipeline)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-publishers texlive-fonts-recommended texlive-bibtex-extra \
            latexmk chktex
          latexmk --version | head -1

      - name: Verify claim links
        run: python3 scripts/verify_claim_links.py

      - name: Lint LaTeX
        run: make lint

      - name: Guard against raw-log leakage
        run: |
          # tracked files must never include private/ payloads or session logs
          leaked=$(git ls-files | grep -E '^private/' | grep -v '^private/README.md$' || true)
          leaked="$leaked$(git ls-files | grep -E '\.(jsonl|ndjson)$' || true)"
          if [ -n "$leaked" ]; then
            echo "raw-log leakage detected in tracked files:"; echo "$leaked"; exit 1
          fi

      - name: Redaction scan of public content
        # content-level backstop: secrets/emails/non-allowlisted repo URLs must
        # never appear in tracked public dirs, whatever the file extension
        run: |
          python3 scripts/redact_check.py \
            --dir evidence --dir claims --dir analysis --dir provenance \
            --dir notes --dir paper

      - name: Build PDF
        run: make pdf

      - uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: build/main.pdf
          if-no-files-found: error
