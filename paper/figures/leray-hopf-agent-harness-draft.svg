<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650"
     viewBox="0 0 1600 650" role="img"
     aria-labelledby="title desc">
  <title id="title">Draft synthesized agent-harness architecture</title>
  <desc id="desc">
    A simplified three-part architecture. The Author defines and adjudicates
    the issue contract. A model-independent orchestrator selects agents,
    skills, and checks. Issue-scoped implementation is assessed by separate
    semantic and mechanical assurance. Semantic findings return to the Author;
    technical findings return to implementation. Runtime controls support
    orchestration and execution.
  </desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#263746"/>
    </marker>
    <marker id="feedback" markerWidth="9" markerHeight="9" refX="8" refY="4.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#9b3535"/>
    </marker>
    <style>
      .title { font: 700 27px Arial, Helvetica, sans-serif; fill: #17232d; }
      .subtitle { font: 15px Arial, Helvetica, sans-serif; fill: #52616d; }
      .layer { font: 700 14px Arial, Helvetica, sans-serif; letter-spacing: 1.1px; }
      .head { font: 700 20px Arial, Helvetica, sans-serif; fill: #17232d; }
      .body { font: 15px Arial, Helvetica, sans-serif; fill: #334653; }
      .small { font: 13px Arial, Helvetica, sans-serif; fill: #4d5d68; }
      .flow { fill: none; stroke: #263746; stroke-width: 3; marker-end: url(#arrow); }
      .join { fill: none; stroke: #263746; stroke-width: 3; }
      .return { fill: none; stroke: #9b3535; stroke-width: 2.7; marker-end: url(#feedback); }
    </style>
  </defs>

  <rect width="1600" height="650" fill="#ffffff"/>
  <text x="60" y="48" class="title">Synthesized agent-harness architecture</text>
  <text x="60" y="75" class="subtitle">
    End-state abstraction reconstructed from controls introduced at different stages
  </text>

  <!-- Layer 1: Author and contract -->
  <rect x="60" y="150" width="370" height="300" rx="16"
        fill="#fbf4f4" stroke="#8e3030" stroke-width="2.5"/>
  <text x="85" y="182" class="layer" fill="#8e3030">AUTHOR AUTHORITY</text>
  <rect x="95" y="210" width="300" height="82" rx="10"
        fill="#f5dfdf" stroke="#8e3030" stroke-width="2"/>
  <text x="245" y="243" text-anchor="middle" class="head">Author</text>
  <text x="245" y="270" text-anchor="middle" class="body">scope · adjudication · acceptance</text>
  <rect x="95" y="320" width="300" height="78" rx="10"
        fill="#e6eff7" stroke="#355e84" stroke-width="2"/>
  <text x="245" y="351" text-anchor="middle" class="head">Issue contract</text>
  <text x="245" y="378" text-anchor="middle" class="body">mathematical target and boundaries</text>
  <rect x="125" y="414" width="240" height="28" rx="7"
        fill="#ffffff" stroke="#65747e" stroke-width="1.6"
        stroke-dasharray="7 5"/>
  <text x="245" y="433" text-anchor="middle" class="small">
    when needed: scout and refine
  </text>
  <path d="M245 292 L245 318" class="flow"/>

  <!-- Layer 2: orchestration -->
  <rect x="515" y="150" width="370" height="300" rx="16"
        fill="#f1f5fb" stroke="#325b9b" stroke-width="2.5"/>
  <text x="540" y="182" class="layer" fill="#325b9b">ORCHESTRATION</text>
  <rect x="550" y="220" width="300" height="105" rx="11"
        fill="#dce8f8" stroke="#325b9b" stroke-width="2"/>
  <text x="700" y="257" text-anchor="middle" class="head">Orchestrator</text>
  <text x="700" y="286" text-anchor="middle" class="body">decompose · delegate · monitor</text>
  <text x="700" y="309" text-anchor="middle" class="small">
    model-independent; policy- and skill-guided
  </text>
  <rect x="550" y="350" width="300" height="64" rx="10"
        fill="#ffffff" stroke="#7893b7" stroke-width="1.8"/>
  <text x="700" y="377" text-anchor="middle" class="body">select worker and assurance</text>
  <text x="700" y="400" text-anchor="middle" class="small">according to the issue and changed artifact</text>

  <!-- Layer 3: implementation and assurance -->
  <rect x="970" y="150" width="570" height="300" rx="16"
        fill="#f2f8f5" stroke="#326b55" stroke-width="2.5"/>
  <text x="995" y="182" class="layer" fill="#326b55">ISSUE-SCOPED EXECUTION</text>
  <rect x="1005" y="230" width="180" height="105" rx="11"
        fill="#dff0e7" stroke="#326b55" stroke-width="2"/>
  <text x="1095" y="267" text-anchor="middle" class="head">Implement</text>
  <text x="1095" y="294" text-anchor="middle" class="body">isolated worktree</text>
  <text x="1095" y="317" text-anchor="middle" class="small">bounded agent task</text>

  <rect x="1220" y="205" width="185" height="68" rx="10"
        fill="#eee6f2" stroke="#6a4a7b" stroke-width="2"/>
  <text x="1312" y="234" text-anchor="middle" class="head">Semantic review</text>
  <text x="1312" y="257" text-anchor="middle" class="small">statement and counterexamples</text>

  <rect x="1220" y="300" width="185" height="68" rx="10"
        fill="#f7eadb" stroke="#a55e1f" stroke-width="2"/>
  <text x="1312" y="329" text-anchor="middle" class="head">Mechanical checks</text>
  <text x="1312" y="352" text-anchor="middle" class="small">Lean, axioms, public surface</text>

  <rect x="1460" y="250" width="62" height="74" rx="10"
        fill="#e3edf0" stroke="#405563" stroke-width="2"/>
  <text x="1491" y="279" text-anchor="middle" class="small">accepted</text>
  <text x="1491" y="299" text-anchor="middle" class="small">project</text>
  <text x="1491" y="319" text-anchor="middle" class="small">state</text>

  <!-- Clear forward flow -->
  <path d="M430 300 L512 300" class="flow"/>
  <text x="471" y="286" text-anchor="middle" class="small">bounded task</text>
  <path d="M885 300 L967 300" class="flow"/>
  <text x="926" y="286" text-anchor="middle" class="small">routed work</text>
  <path d="M1185 282 L1202 282 L1202 239 L1218 239" class="flow"/>
  <path d="M1185 282 L1202 282 L1202 334 L1218 334" class="flow"/>
  <path d="M1405 239 L1425 239 L1425 287" class="join"/>
  <path d="M1405 334 L1425 334 L1425 287" class="join"/>
  <path d="M1425 287 L1458 287" class="flow"/>

  <!-- Feedback has dedicated lanes, away from labels -->
  <path d="M1312 203 L1312 112 L245 112 L245 208" class="return"/>
  <text x="800" y="101" text-anchor="middle" class="small" fill="#8e3030">
    semantic finding: Author revises or adjudicates the contract
  </text>
  <path d="M1312 370 L1312 404 L1095 404 L1095 337" class="return"/>
  <text x="1218" y="424" text-anchor="middle" class="small" fill="#8e3030">
    technical finding: implementation rework
  </text>

  <!-- Runtime governance as a foundation, not an evidence lane -->
  <rect x="515" y="500" width="1025" height="92" rx="14"
        fill="#edf0f2" stroke="#5e6d76" stroke-width="2"/>
  <text x="540" y="531" class="layer" fill="#4b5c66">RUNTIME GOVERNANCE</text>
  <text x="700" y="561" text-anchor="middle" class="body">
    exclusive worktrees
  </text>
  <text x="1027" y="561" text-anchor="middle" class="body">
    shared Lean cache + global build lock
  </text>
  <text x="1360" y="561" text-anchor="middle" class="body">
    liveness, memory, and process cleanup
  </text>
  <line x1="850" y1="540" x2="850" y2="574" stroke="#aab3b9"/>
  <line x1="1195" y1="540" x2="1195" y2="574" stroke="#aab3b9"/>

  <text x="1540" y="628" text-anchor="end" class="small" fill="#8e3030">
    DRAFT FOR AUTHOR REVIEW
  </text>
</svg>
