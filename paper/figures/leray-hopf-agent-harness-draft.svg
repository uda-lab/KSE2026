<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000"
     viewBox="0 0 1800 1000" role="img"
     aria-labelledby="figure-title figure-desc">
  <title id="figure-title">Draft synthesized Leray--Hopf agent-harness architecture</title>
  <desc id="figure-desc">
    A synthesized end-state architecture, reconstructed from controls introduced
    at different stages rather than one unchanged campaign configuration.
    The scientific owner scopes a GitHub Issue and conditional statement contract.
    A model-independent orchestrator routes work to an issue-scoped Git worktree,
    a pull-request candidate, artifact-selected assurance gates, merged project
    state, release candidate, full-build attestation, and an attested release
    artifact. Semantic findings return to the owner and statement contract;
    implementation and mechanical findings return to the worktree. Runtime
    governance and evidence capture form separate horizontal rails.
  </desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#263746"/>
    </marker>
    <marker id="feedback-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#a33a3a"/>
    </marker>
    <marker id="evidence-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#23766f"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, Helvetica, sans-serif; fill: #17232d; }
      .subtitle { font: 600 16px Arial, Helvetica, sans-serif; fill: #495967; }
      .role { font: 700 14px Arial, Helvetica, sans-serif; letter-spacing: 1px; }
      .node-title { font: 700 17px Arial, Helvetica, sans-serif; fill: #17232d; }
      .node-sub { font: 14px Arial, Helvetica, sans-serif; fill: #344652; }
      .small { font: 13px Arial, Helvetica, sans-serif; fill: #344652; }
      .tiny { font: 12px Arial, Helvetica, sans-serif; fill: #465864; }
      .white-title { font: 700 17px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .white-sub { font: 13px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .flow { fill: none; stroke: #263746; stroke-width: 3; marker-end: url(#arrow); }
      .flow-thin { fill: none; stroke: #263746; stroke-width: 2.2; marker-end: url(#arrow); }
      .feedback { fill: none; stroke: #a33a3a; stroke-width: 2.7;
                  marker-end: url(#feedback-arrow); }
      .evidence { fill: none; stroke: #23766f; stroke-width: 2.2;
                  stroke-dasharray: 4 6; marker-end: url(#evidence-arrow); }
      .conditional { stroke-dasharray: 9 6; }
    </style>
  </defs>

