<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560"
     viewBox="0 0 1600 560" role="img"
     aria-labelledby="title desc">
  <title id="title">Draft Author intervention and agent communication model</title>
  <desc id="desc">
    The Author retains final authority. ChatGPT supports investigation,
    synthesis, recommendation, and drafting, while the Author may also
    intervene directly. Author-issued instructions reach the GitHub-mediated
    agent workflow either directly or through the Connector. Review findings
    return to the Author.
  </desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#263746"/>
    </marker>
    <marker id="feedback" markerWidth="9" markerHeight="9" refX="8" refY="4.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#9b3535"/>
    </marker>
    <style>
      .title { font: 700 27px Arial, Helvetica, sans-serif; fill: #17232d; }
      .subtitle { font: 15px Arial, Helvetica, sans-serif; fill: #52616d; }
      .layer { font: 700 14px Arial, Helvetica, sans-serif; letter-spacing: 1.1px; }
      .head { font: 700 21px Arial, Helvetica, sans-serif; fill: #17232d; }
      .body { font: 15px Arial, Helvetica, sans-serif; fill: #334653; }
      .small { font: 13px Arial, Helvetica, sans-serif; fill: #4d5d68; }
      .flow { fill: none; stroke: #263746; stroke-width: 3; marker-end: url(#arrow); }
      .return { fill: none; stroke: #9b3535; stroke-width: 2.7; marker-end: url(#feedback); }
    </style>
  </defs>

  <rect width="1600" height="560" fill="#ffffff"/>
  <text x="60" y="48" class="title">Author intervention and agent communication</text>
  <text x="60" y="75" class="subtitle">
    Authority, decision support, and execution are separate functions
  </text>

  <!-- Three deliberately sparse elements -->
  <rect x="70" y="150" width="350" height="245" rx="16"
        fill="#fbf0f0" stroke="#8e3030" stroke-width="2.6"/>
  <text x="95" y="183" class="layer" fill="#8e3030">FINAL AUTHORITY</text>
  <text x="245" y="235" text-anchor="middle" class="head">Author</text>
  <text x="245" y="270" text-anchor="middle" class="body">sets scope and claim strength</text>
  <text x="245" y="298" text-anchor="middle" class="body">corrects drift and accepts changes</text>
  <rect x="120" y="330" width="250" height="42" rx="9"
        fill="#ffffff" stroke="#b36a6a" stroke-width="1.6"/>
  <text x="245" y="357" text-anchor="middle" class="small">
    may intervene directly at any stage
  </text>

  <rect x="625" y="150" width="350" height="245" rx="16"
        fill="#eef4fb" stroke="#325b9b" stroke-width="2.6"/>
  <text x="650" y="183" class="layer" fill="#325b9b">DECISION SUPPORT</text>
  <text x="800" y="235" text-anchor="middle" class="head">ChatGPT</text>
  <text x="800" y="270" text-anchor="middle" class="body">investigate · synthesise</text>
  <text x="800" y="298" text-anchor="middle" class="body">recommend · draft</text>
  <rect x="675" y="330" width="250" height="42" rx="9"
        fill="#ffffff" stroke="#7893b7" stroke-width="1.6"/>
  <text x="800" y="357" text-anchor="middle" class="small">
    no independent final authority
  </text>

  <rect x="1180" y="150" width="350" height="245" rx="16"
        fill="#eef7f2" stroke="#326b55" stroke-width="2.6"/>
  <text x="1205" y="183" class="layer" fill="#326b55">PROJECT EXECUTION</text>
  <text x="1355" y="226" text-anchor="middle" class="head">GitHub-mediated workflow</text>
  <text x="1355" y="263" text-anchor="middle" class="body">issue contract → orchestration</text>
  <text x="1355" y="291" text-anchor="middle" class="body">implementation → review</text>
  <rect x="1230" y="330" width="250" height="42" rx="9"
        fill="#ffffff" stroke="#73a28d" stroke-width="1.6"/>
  <text x="1355" y="357" text-anchor="middle" class="small">
    agents act within delegated scope
  </text>

  <!-- Deliberation -->
  <path d="M420 245 L622 245" class="flow"/>
  <text x="521" y="228" text-anchor="middle" class="small">
    question and context
  </text>
  <path d="M625 300 L423 300" class="flow"/>
  <text x="524" y="322" text-anchor="middle" class="small">
    analysis and proposed action
  </text>

  <!-- Two non-conflicting transmission paths -->
  <path d="M975 245 L1177 245" class="flow"/>
  <text x="1076" y="219" text-anchor="middle" class="small">
    Author-issued transmission
  </text>
  <text x="1076" y="237" text-anchor="middle" class="small">
    via GitHub Connector
  </text>
  <path d="M245 395 L245 462 L1355 462 L1355 398" class="flow"/>
  <text x="800" y="452" text-anchor="middle" class="small">
    direct Author instruction or correction
  </text>

  <!-- Review return has its own upper lane -->
  <path d="M1355 148 L1355 112 L245 112 L245 148" class="return"/>
  <text x="800" y="101" text-anchor="middle" class="small" fill="#8e3030">
    findings and unresolved choices return to the Author
  </text>

  <text x="1530" y="535" text-anchor="end" class="small" fill="#8e3030">
    DRAFT FOR AUTHOR REVIEW
  </text>
</svg>
