    <path d="M1470 474 L1470 430" fill="none" stroke="#263746" stroke-width="3" marker-end="url(#arrow2)"></path>
    <text x="1485" y="452" font-size="23" fill="#4a5866">read</text>
    <rect x="1275" y="440" width="170" height="86" rx="12" fill="#dde5ee" stroke="#b3c0cd" stroke-width="1.4"></rect>
    <g fill="none" stroke="#6d8199" stroke-width="3" stroke-linecap="round">
      <rect x="1336" y="450" width="48" height="34" rx="5"></rect>
      <path d="M1344 459 L1351 466 L1344 473"></path>
      <path d="M1358 473 H1372"></path>
    </g>
    <text x="1360" y="512" text-anchor="middle" font-size="23" fill="#3d4c5a">git / gh</text>

  </g>
</svg>