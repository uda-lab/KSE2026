<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="570" viewBox="0 0 1600 570" role="img" aria-labelledby="title desc">
  <title id="title">Three actors over a shared GitHub rail</title>
  <desc id="desc">
    The author retains final authority and is the hub: they exchange context and
    summaries with ChatGPT, and separately hand an issue contract to the agent
    harness. An unlabelled band between those two arrows narrows toward the
    author, so that material returns as a summary rather than in full. ChatGPT
    is advisory only and touches GitHub solely through the official GitHub App
    connector. The agent harness reads and writes GitHub as its working context.
    GitHub itself is not an actor but the medium that records Issues, PRs, and
    reviews, drawn as a rail beneath all three. Each actor reaches the rail
    through its own medium: the author directly, without ChatGPT in the path,
    ChatGPT through the GitHub App connector, the agent harness through git and
    the gh CLI.
  </desc>
  <defs>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0.5 L12,6 L0,11.5 Z" fill="#263746"></path>
    </marker>
  </defs>

  <rect width="1600" height="570" fill="#ffffff"></rect>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">

    
    <path d="M240 156 L240 112 L1360 112 L1360 154" fill="none" stroke="#263746" stroke-width="3" marker-end="url(#arrow2)"></path>
    <text x="800" y="94" text-anchor="middle" font-size="25" fill="#4a5866">issue contract</text>

    
    <rect x="50" y="156" width="380" height="270" rx="16" fill="#fbf0f0" stroke="#8e3030" stroke-width="2.6"></rect>
    <text x="76" y="193" font-size="28" font-weight="700" letter-spacing="1.4" fill="#8e3030">FINAL AUTHORITY</text>
    <text x="240" y="252" text-anchor="middle" font-size="38" font-weight="700" fill="#1b2733">Author</text>
    <text x="240" y="296" text-anchor="middle" font-size="28" fill="#2c3a47">scope · claims · accept</text>
    <rect x="90" y="352" width="300" height="48" rx="10" fill="#ffffff" stroke="#b36a6a" stroke-width="1.8"></rect>
    <text x="240" y="383" text-anchor="middle" font-size="26" fill="#4a5866">direct intervention</text>

    
    <rect x="610" y="156" width="380" height="270" rx="16" fill="#eef4fb" stroke="#325b9b" stroke-width="2.6"></rect>
    <text x="636" y="193" font-size="28" font-weight="700" letter-spacing="1.4" fill="#325b9b">DECISION SUPPORT</text>
    <text x="800" y="248" text-anchor="middle" font-size="38" font-weight="700" fill="#1b2733">ChatGPT</text>
    <text x="800" y="288" text-anchor="middle" font-size="28" fill="#2c3a47">investigate · synthesise</text>
    <text x="800" y="322" text-anchor="middle" font-size="28" fill="#2c3a47">recommend · draft</text>
    <rect x="650" y="352" width="300" height="48" rx="10" fill="#ffffff" stroke="#7893b7" stroke-width="1.8"></rect>
    <text x="800" y="383" text-anchor="middle" font-size="26" fill="#4a5866">advisory only</text>

    
    <rect x="1170" y="156" width="380" height="270" rx="16" fill="#eef7f2" stroke="#326b55" stroke-width="2.6"></rect>
    <text x="1196" y="193" font-size="28" font-weight="700" letter-spacing="1.4" fill="#326b55">EXECUTION</text>
    <text x="1360" y="252" text-anchor="middle" font-size="38" font-weight="700" fill="#1b2733">Agent harness</text>
    <text x="1360" y="296" text-anchor="middle" font-size="28" fill="#2c3a47">plan · implement · review</text>
    <rect x="1210" y="352" width="300" height="48" rx="10" fill="#ffffff" stroke="#73a28d" stroke-width="1.8"></rect>
    <text x="1360" y="383" text-anchor="middle" font-size="26" fill="#4a5866">issue-scoped</text>

    
    <g fill="none" stroke="#263746" stroke-width="3" marker-end="url(#arrow2)">
