<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650"
     viewBox="0 0 1600 650" role="img"
     aria-labelledby="title desc">
  <title id="title">Synthesized agent-harness architecture</title>
  <desc id="desc">
    A simplified three-part architecture. The scientific owner defines and
    adjudicates the issue contract. A model-independent orchestrator selects
    agents, skills, and checks. Issue-scoped implementation is assessed by
    separate applicable semantic and mechanical assurance selected for the
    changed artifact. Semantic findings return to both the scientific owner
    and issue contract; technical findings return to implementation. Runtime
    controls support orchestration and execution.
  </desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#263746"/>
    </marker>
    <marker id="feedback" markerWidth="11" markerHeight="11" refX="10" refY="5.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#9b3535"/>
    </marker>
    <style>
      .title { font: 700 32px Arial, Helvetica, sans-serif; fill: #17232d; }
      .layer { font: 700 30px Arial, Helvetica, sans-serif; letter-spacing: 0.8px; }
      .head { font: 700 34px Arial, Helvetica, sans-serif; fill: #17232d; }
      .body { font: 28px Arial, Helvetica, sans-serif; fill: #334653; }
      .small { font: 26px Arial, Helvetica, sans-serif; fill: #4d5d68; }
      .flow { fill: none; stroke: #263746; stroke-width: 3; marker-end: url(#arrow); }
      .conditional { stroke-dasharray: 8 6; }
      .join { fill: none; stroke: #263746; stroke-width: 3; }
      .return { fill: none; stroke: #9b3535; stroke-width: 2.7; stroke-dasharray: 12 8; marker-end: url(#feedback); }
      .return-trunk { fill: none; stroke: #9b3535; stroke-width: 2.7; stroke-dasharray: 12 8; }
    </style>
  </defs>

  <rect width="1600" height="650" fill="#ffffff"/>

  <!-- Layer 1: Author and contract -->
  <rect x="60" y="150" width="370" height="300" rx="16"
        fill="#fbf4f4" stroke="#8e3030" stroke-width="2.5"/>
  <text x="85" y="182" class="layer" fill="#8e3030">SCIENTIFIC OWNER</text>
  <rect x="95" y="210" width="300" height="82" rx="10"
        fill="#f5dfdf" stroke="#8e3030" stroke-width="2"/>
  <text x="245" y="243" text-anchor="middle" class="head">Scientific owner</text>
  <text x="245" y="271" text-anchor="middle" class="body">scope · decide</text>
  <rect x="95" y="320" width="300" height="78" rx="10"
        fill="#e6eff7" stroke="#355e84" stroke-width="2"/>
  <text x="245" y="351" text-anchor="middle" class="head">Issue contract</text>
  <text x="245" y="380" text-anchor="middle" class="body">target · boundaries</text>
  <rect x="125" y="414" width="240" height="28" rx="7"
        fill="#ffffff" stroke="#65747e" stroke-width="1.6"
        stroke-dasharray="7 5"/>
  <text x="245" y="434" text-anchor="middle" class="small">optional scouting</text>
  <path d="M245 292 L245 318" class="flow"/>

  <!-- Layer 2: orchestration -->
  <rect x="515" y="150" width="370" height="300" rx="16"
        fill="#f1f5fb" stroke="#325b9b" stroke-width="2.5"/>
  <text x="540" y="182" class="layer" fill="#325b9b">ORCHESTRATION</text>
  <rect x="550" y="220" width="300" height="105" rx="11"
        fill="#dce8f8" stroke="#325b9b" stroke-width="2"/>
  <text x="700" y="257" text-anchor="middle" class="head">Orchestrator</text>
  <text x="700" y="287" text-anchor="middle" class="body">plan · delegate</text>
  <text x="700" y="313" text-anchor="middle" class="small">policy + skills</text>
  <rect x="550" y="350" width="300" height="64" rx="10"
        fill="#ffffff" stroke="#7893b7" stroke-width="1.8"/>
  <text x="700" y="389" text-anchor="middle" class="body">route work + checks</text>

  <!-- Layer 3: implementation and assurance -->
  <rect x="970" y="150" width="570" height="300" rx="16"
        fill="#f2f8f5" stroke="#326b55" stroke-width="2.5"/>
  <text x="995" y="182" class="layer" fill="#326b55">ISSUE-SCOPED EXECUTION</text>
  <rect x="1005" y="230" width="180" height="105" rx="11"
        fill="#dff0e7" stroke="#326b55" stroke-width="2"/>
  <text x="1095" y="267" text-anchor="middle" class="head">Implement</text>
  <text x="1095" y="303" text-anchor="middle" class="body">worktree</text>

  <rect x="1210" y="205" width="210" height="68" rx="10"
        fill="#eee6f2" stroke="#6a4a7b" stroke-width="2"/>
  <text x="1315" y="234" text-anchor="middle" class="head">Semantic</text>
  <text x="1315" y="260" text-anchor="middle" class="small">claim · example</text>

  <rect x="1210" y="300" width="210" height="68" rx="10"
        fill="#f7eadb" stroke="#a55e1f" stroke-width="2"/>
  <text x="1315" y="329" text-anchor="middle" class="head">Lean checks</text>
  <text x="1315" y="355" text-anchor="middle" class="small">build · API</text>

  <rect x="1440" y="250" width="90" height="74" rx="10"
        fill="#e3edf0" stroke="#405563" stroke-width="2"/>
  <text x="1485" y="280" text-anchor="middle" class="small">merge</text>
  <text x="1485" y="307" text-anchor="middle" class="small">state</text>

  <!-- Clear forward flow -->
  <path d="M430 300 L512 300" class="flow"/>
  <text x="471" y="282" text-anchor="middle" class="small">contract</text>
  <path d="M885 300 L967 300" class="flow"/>
  <text x="926" y="282" text-anchor="middle" class="small">task</text>
  <text x="1375" y="430" text-anchor="middle" class="small">as applicable</text>
  <path d="M1185 282 L1198 282 L1198 239 L1207 239" class="flow conditional"/>
  <path d="M1185 282 L1198 282 L1198 334 L1207 334" class="flow conditional"/>
  <path d="M1420 239 L1432 239 L1432 287" class="join"/>
  <path d="M1420 334 L1432 334 L1432 287" class="join"/>
  <path d="M1432 287 L1438 287" class="flow"/>

  <!-- Feedback has dedicated lanes, away from labels -->
  <path d="M1315 203 L1315 112 L35 112 L35 359" class="return-trunk"/>
  <path d="M35 251 L93 251" class="return"/>
  <path d="M35 359 L93 359" class="return"/>
  <text x="700" y="101" text-anchor="middle" class="small" fill="#8e3030">semantic feedback</text>
  <path d="M1315 370 L1315 404 L1095 404 L1095 337" class="return"/>
  <text x="1218" y="430" text-anchor="middle" class="small" fill="#8e3030">rework</text>

  <!-- Runtime governance as a foundation, not an evidence lane -->
  <rect x="515" y="500" width="1025" height="92" rx="14"
        fill="#edf0f2" stroke="#5e6d76" stroke-width="2"/>
  <text x="540" y="531" class="layer" fill="#4b5c66">RUNTIME GOVERNANCE</text>
  <text x="700" y="561" text-anchor="middle" class="body">
    worktree isolation
  </text>
  <text x="1027" y="561" text-anchor="middle" class="body">
    cache + build lock
  </text>
  <text x="1360" y="561" text-anchor="middle" class="body">
    process hygiene
  </text>
  <line x1="850" y1="540" x2="850" y2="574" stroke="#aab3b9"/>
  <line x1="1195" y1="540" x2="1195" y2="574" stroke="#aab3b9"/>

</svg>
