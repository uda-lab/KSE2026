    <text x="690" y="589" text-anchor="middle" font-size="27" fill="#2c3a47">worktree isolation</text>
    <text x="1030" y="589" text-anchor="middle" font-size="27" fill="#2c3a47">cache + build lock</text>
    <text x="1370" y="589" text-anchor="middle" font-size="27" fill="#2c3a47">process hygiene</text>
    <path d="M860 566 L860 600 M1200 566 L1200 600" stroke="#aab3b9" stroke-width="1.6"></path>

    
