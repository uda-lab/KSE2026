<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="635" viewBox="0 0 1600 635" role="img" aria-labelledby="title desc">
  <title id="title">Synthesized agent-harness architecture</title>
  <desc id="desc">
    A three-part architecture, expanding the agent harness of the preceding
    figure. The author defines and adjudicates the issue contract. A
    model-independent orchestrator selects agents, skills, and checks.
    Issue-scoped implementation is assessed by separate semantic and mechanical
    assurance, selected as applicable to the changed artifact. Semantic findings
    return to both the author and the issue contract; technical findings return
    to implementation along the dashed red paths. Runtime controls support
    orchestration and execution.
  </desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0.5 L12,6 L0,11.5 Z" fill="#263746"></path>
    </marker>
    <marker id="feedback" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0.5 L12,6 L0,11.5 Z" fill="#9b3535"></path>
    </marker>
    <marker id="cond" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0.5 L11,5.5 L0,10.5 Z" fill="#5e6d76"></path>
    </marker>
  </defs>

  <rect width="1600" height="635" fill="#ffffff"></rect>

